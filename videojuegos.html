<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro al Torneo Gamer 2026</title>
    <style>
        /* Estilos Generales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor del Formulario */
        .form-container {
            background-color: #2a2a40;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #00ffcc;
        }

        p.subtitle {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
        }

        /* Grupos de Formulario */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e0e0e0;
            font-weight: 600;
        }

        /* Inputs de Texto, Email, Número y Select */
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #444460;
            border-radius: 6px;
            background-color: #1f1f30;
            color: #fff;
            font-size: 15px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #00ffcc;
        }

        /* Radio Buttons y Checkboxes Inline */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        /* Botón de Envío */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #00ffcc;
            border: none;
            border-radius: 6px;
            color: #111119;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #00ccaa;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Inscripción Torneo</h2>
        <p class="subtitle">Completa tus datos para asegurar tu cupo en la arena</p>

        <!-- Formulario principal -->
        <form action="#" method="POST">
            
            <!-- Campo: Texto -->
            <div class="form-group">
                <label for="gamertag">Gamertag (Nombre de usuario)</label>
                <input type="text" id="gamertag" name="gamertag" placeholder="Ej. NeonRider99" required>
            </div>

            <!-- Campo: Email -->
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>
            </div>

            <!-- Campo: Número -->
            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="12" max="99" placeholder="Mínimo 12 años" required>
            </div>

            <!-- Campo: Selección (Dropdown) -->
            <div class="form-group">
                <label for="juego">Selecciona tu Juego</label>
                <select id="juego" name="juego" required>
                    <option value="" disabled selected>Elige un videojuego...</option>
                    <option value="fps">Valorant / Counter-Strike</option>
                    <option value="moba">League of Legends</option>
                    <option value="br">Fortnite / Apex Legends</option>
                    <option value="fighting">Super Smash Bros</option>
                </select>
            </div>

            <!-- Campo: Botones de Radio -->
            <div class="form-group">
                <label>Plataforma principal</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="plataforma" value="pc" checked> PC
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="plataforma" value="consola"> Consola
                    </label>
                </div>
            </div>

            <!-- Campo: Checkbox -->
            <div class="form-group">
                <label class="radio-label">
                    <input type="checkbox" name="terminos" required> Acepto el reglamento del torneo
                </label>
            </div>

            <!-- Botón de enviar -->
            <button type="submit" class="btn-submit">Registrarme Ahora</button>

        </form>
    </div>

</body>
</html>
